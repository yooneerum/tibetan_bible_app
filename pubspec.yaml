name: tibetan_bible_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  sqflite: ^2.4.2
  path: ^1.9.1

  shared_preferences: ^2.5.3
  provider: ^6.1.5+1

dev_dependencies:
